    <script>
      (function() {
        try {
          var mode = localStorage.getItem('locus_theme_mode');
          var isDark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-text-primary antialiased font-sans selection:bg-accent-sage-tint selection:text-accent-sage">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
